name: Live validation (manual, uses API credits)

# Manual only: spends Tavily credits and LLM quota.
# Needs repo secrets TAVILY_API_KEY, OPENAI_API_KEY and repo variables
# VERICODE_LLM_PROVIDER, OPENAI_BASE_URL, VERICODE_CODER_MODEL, VERICODE_PLANNER_MODEL.
on:
  workflow_dispatch:
    inputs:
      benchmark_runs:
        description: "Paired benchmark runs (demo 3)"
        default: "3"
        required: true
      only:
        description: "Harness sections to run (comma-separated, empty = all)"
        default: ""
        required: false
      skip_benchmark:
        description: "Skip the paired benchmark inside the harness (demo 3 still runs)"
        default: "true"
        required: true

permissions:
  contents: read

concurrency:
  group: live-validation
  cancel-in-progress: false

jobs:
  live:
    name: Live tests + demos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VERICODE_LLM_PROVIDER: ${{ vars.VERICODE_LLM_PROVIDER }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      VERICODE_CODER_MODEL: ${{ vars.VERICODE_CODER_MODEL }}
      VERICODE_PLANNER_MODEL: ${{ vars.VERICODE_PLANNER_MODEL }}
      VERICODE_DEMO_MODE: "0"
      VERICODE_LIVE_TESTS: "1"
      VERICODE_TOKEN_FILE: /tmp/vericode_live_token
      VERICODE_DB: /tmp/vericode_live.db
      # reasoning_effort for planner/judge/claim-extraction only (coder/repair identical in both benchmark modes);
      # dropped automatically if the model rejects it
      VERICODE_STRUCTURED_REASONING_EFFORT: ${{ vars.VERICODE_STRUCTURED_REASONING_EFFORT || 'low' }}
    steps:
      - uses: actions/checkout@v5
      - name: Check credentials present
        run: |
          missing=0
          for v in TAVILY_API_KEY OPENAI_API_KEY VERICODE_LLM_PROVIDER OPENAI_BASE_URL VERICODE_CODER_MODEL VERICODE_PLANNER_MODEL; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; missing=1; fi
          done
          exit $missing
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install backend + demo projects
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements-dev.txt
          python -m venv demos/sample_project/.venv
          demos/sample_project/.venv/bin/pip install "pydantic==2.9.2" pytest
          npm ci --prefix tools/ts-checker --no-audit --no-fund
          npm ci --prefix demos/ts_project --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend
      - name: Live validation harness (Groq + Tavily, writes reports/live)
        id: harness
        working-directory: backend
        run: ../.venv/bin/python -m vericode.live_validation --runs "${{ inputs.benchmark_runs }}" ${{ inputs.skip_benchmark == 'true' && '--skip-benchmark' || '' }} --only "${{ inputs.only }}"
      - name: Upload live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-report
          path: reports/live/
          if-no-files-found: warn
      - name: Browser checks over the persisted live results (8 screens)
        if: always()
        env:
          VERICODE_LIVE_DB: /tmp/vericode_live.db
        run: .venv/bin/python -m pytest -q -p no:cacheprovider backend/tests/test_e2e_live.py -rs
      - name: Live tests
        if: always() && inputs.only == ''
        run: .venv/bin/python -m pytest -q -p no:cacheprovider backend/tests -m live -rs
      - name: Demo D (live stale-answer check)
        if: always() && inputs.only == ''
        run: scripts/demo.sh d --live
      - name: Demo C (combined workflow)
        if: always() && inputs.only == ''
        run: scripts/demo.sh c
      - name: Demo 3 (paired benchmark)
        # the harness already ran the same run_benchmark() when skip_benchmark=false; don't spend the quota twice
        if: always() && inputs.skip_benchmark == 'true' && inputs.only == ''
        run: scripts/demo.sh 3 --runs "${{ inputs.benchmark_runs }}"
